<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Piper — Training UI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <h1>Piper — Avvia Training</h1>
      <p style="color:#666;margin-top:4px">Interfaccia per avviare training e sintetizzare testo. Protezione training tramite password opzionale.</p>

      <div id="banner" class="banner" role="status" aria-live="polite" style="display:none"></div>

      <div class="tabs">
        <button class="tab-button active" data-tab="training">Training</button>
        <button class="tab-button" data-tab="tts">Scrivi e ascolta</button>
      </div>

      <div id="tab-training" class="tab-panel active">
        <form id="trainForm">
          <label>Voice name
            <input name="voice_name" placeholder="es: my_voice" />
          </label>

          <label>CSV path
            <input name="csv_path" placeholder="/path/to/metadata.csv" />
          </label>

          <label>Audio dir
            <input name="audio_dir" placeholder="/path/to/audio/" />
          </label>

          <label>Sample rate
            <input name="sample_rate" placeholder="22050" />
          </label>

          <label>Batch size
            <input name="batch_size" placeholder="32" />
          </label>

          <label>Checkpoint (optional)
            <input name="ckpt_path" placeholder="/path/to/ckpt.ckpt" />
          </label>

          <label>Extra args
            <input name="extra_args" placeholder='--data.phoneme_type text' />
          </label>

          <label>Password (training)
            <input name="train_password" type="password" placeholder="Password per avviare training" />
          </label>

          <div class="actions">
            <button id="startBtn" type="submit">Start training</button>
            <button id="stopBtn" type="button" disabled>Stop job</button>
            <button id="clearLogsBtn" type="button">Clear logs</button>
          </div>
        </form>

        <section id="run">
          <h2>Log</h2>
          <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
            <div>
              <button id="refreshJobsBtn" type="button">Refresh jobs</button>
              <label style="margin-left:8px;font-size:90%"><input id="autoRefreshJobs" type="checkbox" /> Auto-refresh</label>
            </div>
            <div id="jobSummary" style="color:#444;font-size:90%"></div>
          </div>
          <div id="jobsList" style="margin-bottom:8px"></div>
          <div id="logbox"><pre id="logpre"></pre></div>
          <div id="jobInfo" style="margin-top:8px;color:#333"></div>
        </section>
      </div>

      <div id="tab-tts" class="tab-panel">
        <section id="tts">
          <h2>Scrivi e ascolta</h2>

          <label>Voce
            <select id="voiceSelect"><option>Caricamento...</option></select>
          </label>

          <div id="voiceInfo" style="color:#444;font-size:90%;margin-bottom:8px"></div>

          <label>Speaker (se disponibile)
            <select id="speakerSelect" style="display:none"></select>
          </label>

          <label>Testo
            <textarea id="ttsText" placeholder="Scrivi il testo qui..." rows="4"></textarea>
          </label>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <label style="flex:1">Length scale
              <input id="lengthScale" type="number" step="0.1" value="1.0" />
            </label>
            <label style="flex:1">Noise scale
              <input id="noiseScale" type="number" step="0.01" value="0.667" />
            </label>
            <label style="flex:1">Noise w scale
              <input id="noiseWScale" type="number" step="0.01" value="0.8" />
            </label>
          </div>

          <div class="actions" style="margin-top:8px">
            <button id="playTtsBtn" type="button">Play</button>
            <button id="stopTtsBtn" type="button" disabled>Stop</button>
            <button id="downloadTtsBtn" type="button" disabled>Download WAV</button>
          </div>

          <audio id="ttsAudio" controls style="display:none;margin-top:8px"></audio>
        </section>
      </div>
    </main>

    <script>
      (function () {
        'use strict';

        // Banner helpers
        const bannerEl = document.getElementById('banner');
        function clearBanner() { if (!bannerEl) return; bannerEl.className = 'banner'; bannerEl.textContent = ''; bannerEl.style.display = 'none'; }
        function showBanner(type, text, timeout=6000) { if (!bannerEl) return; bannerEl.className = `banner show ${type}`; bannerEl.textContent = text; bannerEl.style.display = 'block'; if (timeout>0) setTimeout(clearBanner, timeout); }
        function showError(text, timeout) { showBanner('error', text, timeout); }
        function showSuccess(text, timeout) { showBanner('success', text, timeout); }
        function showInfo(text, timeout) { showBanner('info', text, timeout); }

        // Training UI elements
        const form = document.getElementById('trainForm');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearLogsBtn = document.getElementById('clearLogsBtn');
        const refreshJobsBtn = document.getElementById('refreshJobsBtn');
        const autoRefreshJobs = document.getElementById('autoRefreshJobs');
        const jobsList = document.getElementById('jobsList');
        const jobSummary = document.getElementById('jobSummary');
        const logpre = document.getElementById('logpre');
        const logbox = document.getElementById('logbox');
        const jobInfo = document.getElementById('jobInfo');

        let es = null;
        let currentJobId = null;
        let jobsInterval = null;

        function appendLog(line) {
          logpre.textContent += line + '\n';
          logbox.scrollTop = logbox.scrollHeight;
        }

        function clearLogs() { logpre.textContent = ''; }

        async function fetchJobs() {
          try {
            const res = await fetch('/train/jobs');
            if (!res.ok) throw new Error('Impossibile ottenere job');
            const data = await res.json();
            renderJobs(data);
            return data;
          } catch (err) {
            jobsList.innerHTML = '<div style="color:crimson">Errore caricamento jobs</div>';
            return {};
          }
        }

        function renderJobs(data) {
          jobsList.innerHTML = '';
          const ids = Object.keys(data || {});
          let running = 0;
          ids.forEach(jid => {
            const j = data[jid];
            const el = document.createElement('div');
            el.style.padding = '6px 8px';
            el.style.border = '1px solid #eee';
            el.style.marginBottom = '6px';
            el.innerHTML = `<strong>${jid}</strong> — <em>${j.status}</em><div style="font-size:90%">${j.cmd || ''}</div>`;
            const actions = document.createElement('div');
            actions.style.marginTop = '6px';
            const viewBtn = document.createElement('button');
            viewBtn.textContent = 'View logs';
            viewBtn.addEventListener('click', () => { subscribeToLogs(jid); jobInfo.textContent = `Job: ${jid} — ${j.cmd || ''}`; });
            actions.appendChild(viewBtn);
            const stopBtnLocal = document.createElement('button');
            stopBtnLocal.style.marginLeft = '8px';
            stopBtnLocal.textContent = 'Stop';
            stopBtnLocal.addEventListener('click', async () => {
              await fetch('/train/stop/' + jid, { method: 'POST' });
              appendLog(`[UI] Requested stop for ${jid}`);
              await fetchJobs();
            });
            actions.appendChild(stopBtnLocal);
            el.appendChild(actions);
            jobsList.appendChild(el);
            if (j.status === 'running') running += 1;
          });
          jobSummary.textContent = `Jobs: ${ids.length} — Running: ${running}`;
        }

        function subscribeToLogs(jobId) {
          if (es) try { es.close(); } catch (e) {}
          currentJobId = jobId;
          clearLogs();
          es = new EventSource('/train/logs/' + jobId);
          es.onmessage = (ev) => { appendLog(ev.data); };
          es.onerror = (e) => { appendLog('[SSE] connection closed'); if (es) try { es.close(); } catch (e) {} };
          startBtn.disabled = true;
          stopBtn.disabled = false;
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          startBtn.disabled = true;
          clearLogs();
          jobInfo.textContent = '';

          const formData = new FormData(form);
          const obj = Object.fromEntries(formData.entries());

          try {
            const resp = await fetch('/train/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
            if (!resp.ok) {
              const txt = await resp.text();
              showError('Start failed: ' + txt);
              startBtn.disabled = false;
              return;
            }
            const json = await resp.json();
            subscribeToLogs(json.job_id);
            jobInfo.textContent = `Job: ${json.job_id} — ${json.cmd}`;
            await fetchJobs();
          } catch (err) {
            showError('Errore start: ' + (err && err.message ? err.message : err));
            startBtn.disabled = false;
          }
        });

        stopBtn.addEventListener('click', async () => {
          if (!currentJobId) return;
          stopBtn.disabled = true;
          try {
            const pw = (new FormData(form)).get('train_password');
            const headers = pw ? { 'Content-Type': 'application/json' } : undefined;
            await fetch('/train/stop/' + currentJobId, { method: 'POST', headers, body: pw ? JSON.stringify({ train_password: pw }) : undefined });
            appendLog(`[UI] Requested stop for ${currentJobId}`);
            if (es) try { es.close(); } catch (e) {}
            startBtn.disabled = false;
            await fetchJobs();
          } catch (err) {
            appendLog('[UI] Error stopping job');
            stopBtn.disabled = false;
          }
        });

        clearLogsBtn.addEventListener('click', clearLogs);
        refreshJobsBtn.addEventListener('click', () => fetchJobs());
        autoRefreshJobs.addEventListener('change', () => {
          if (autoRefreshJobs.checked) {
            jobsInterval = setInterval(fetchJobs, 3000);
          } else if (jobsInterval) {
            clearInterval(jobsInterval); jobsInterval = null;
          }
        });

        // ----------------------
        // TTS UI
        // ----------------------
        const voiceSelect = document.getElementById('voiceSelect');
        const speakerSelect = document.getElementById('speakerSelect');
        const voiceInfo = document.getElementById('voiceInfo');
        const ttsText = document.getElementById('ttsText');
        const playTtsBtn = document.getElementById('playTtsBtn');
        const stopTtsBtn = document.getElementById('stopTtsBtn');
        const downloadTtsBtn = document.getElementById('downloadTtsBtn');
        const ttsAudio = document.getElementById('ttsAudio');
        const lengthScale = document.getElementById('lengthScale');
        const noiseScale = document.getElementById('noiseScale');
        const noiseWScale = document.getElementById('noiseWScale');

        let _audioUrl = null;
        let voicesConfig = {};

        async function loadVoices() {
          try {
            const res = await fetch('/voices');
            if (!res.ok) throw new Error('Impossibile caricare le voci');
            const voices = await res.json();
            voicesConfig = voices || {};
            voiceSelect.innerHTML = '';
            const keys = Object.keys(voicesConfig);
            if (keys.length === 0) {
              voiceSelect.innerHTML = '<option value="">(nessuna voce locale)</option>';
            } else {
              for (const k of keys) {
                const o = document.createElement('option'); o.value = k; o.textContent = k; voiceSelect.appendChild(o);
              }
            }
            updateVoiceInfo();
          } catch (err) {
            voiceSelect.innerHTML = '<option value="">(errore)</option>';
          }
        }

        function updateVoiceInfo() {
          const model = voiceSelect.value;
          const cfg = voicesConfig[model];
          if (!cfg) {
            voiceInfo.textContent = '';
            speakerSelect.style.display = 'none';
            return;
          }
          const parts = [];
          if (cfg.sample_rate) parts.push('Sample rate: ' + cfg.sample_rate);
          if (cfg.num_speakers) parts.push('Speakers: ' + cfg.num_speakers);
          voiceInfo.textContent = parts.join(' — ');

          if (cfg.num_speakers && cfg.num_speakers > 1 && cfg.speaker_id_map) {
            speakerSelect.style.display = 'inline-block';
            speakerSelect.innerHTML = '';
            for (const [name, id] of Object.entries(cfg.speaker_id_map)) {
              const o = document.createElement('option'); o.value = id; o.textContent = name + ' (' + id + ')'; speakerSelect.appendChild(o);
            }
          } else {
            speakerSelect.style.display = 'none';
          }
        }

        voiceSelect.addEventListener('change', updateVoiceInfo);

        playTtsBtn.addEventListener('click', async () => {
          const text = (ttsText.value || '').trim();
          if (!text) { showError('Inserisci testo da sintetizzare'); return; }
          playTtsBtn.disabled = true; stopTtsBtn.disabled = false; downloadTtsBtn.disabled = true;
          try {
            const body = { input: text };
            const model = voiceSelect.value; if (model) body.model = model;
            const sp = speakerSelect.value; if (sp) body.speaker_id = Number(sp);
            body.length_scale = Number(lengthScale.value || 1.0);
            body.noise_scale = Number(noiseScale.value || 0.667);
            body.noise_w_scale = Number(noiseWScale.value || 0.8);

            const resp = await fetch('/v1/audio/speech', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            if (!resp.ok) { const txt = await resp.text(); throw new Error(txt || resp.statusText); }
            const arr = await resp.arrayBuffer();
            const blob = new Blob([arr], { type: 'audio/wav' });
            if (_audioUrl) URL.revokeObjectURL(_audioUrl);
            _audioUrl = URL.createObjectURL(blob);
            ttsAudio.src = _audioUrl; ttsAudio.style.display = 'block'; await ttsAudio.play();
            downloadTtsBtn.disabled = false;
            downloadTtsBtn.onclick = () => { const a = document.createElement('a'); a.href = _audioUrl; a.download = 'tts.wav'; document.body.appendChild(a); a.click(); a.remove(); };
          } catch (err) { showError('Errore TTS: ' + (err && err.message ? err.message : err)); }
          finally { playTtsBtn.disabled = false; }
        });

        stopTtsBtn.addEventListener('click', () => { if (ttsAudio && !ttsAudio.paused) { ttsAudio.pause(); ttsAudio.currentTime = 0; } stopTtsBtn.disabled = true; });

        // Initialize
        loadVoices();
        fetchJobs();

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const tab = btn.dataset.tab;
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            const panel = document.getElementById('tab-' + tab);
            if (panel) panel.classList.add('active');
          });
        });

      })();
    </script>
  </body>
</html>
